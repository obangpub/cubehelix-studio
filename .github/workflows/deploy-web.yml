name: deploy-web

on:
  push:
    branches: [main, staging]
    paths:
      - "packages/core/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

# A push to main is a production deploy; a push to staging is a branch deploy.
# Keep the two independent, but let a newer push to the same branch supersede.
concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @cubehelix-studio/web build

      # Cloudflare Pages serves a deploy on the project's production branch
      # (main) at the production domain; any other branch (staging) becomes a
      # branch deploy that a subdomain can be pinned to. wrangler runs via
      # `pnpm dlx` at a pinned version: it is a deploy-only tool, kept out of
      # the workspace install that every other job and contributor pays for.
      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@4.92.0 pages deploy apps/web/dist --project-name=cubehelix-studio --branch="${{ github.ref_name }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
