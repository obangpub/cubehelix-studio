name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which stacks this change touches. The js/python jobs run only when
  # relevant, but the workflow itself always triggers — so the `ci` gate below
  # is always reported and can safely be a required status check, unlike the
  # path-filtered jobs themselves.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      js: ${{ steps.detect.outputs.js }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # On push to main, run everything; on a PR, diff against the base.
          if [ "$EVENT" != "pull_request" ]; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "Changed files:"
          echo "$changed"
          js=false
          python=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              packages/core/* | apps/web/* | fixtures/* | scripts/* | \
              package.json | pnpm-lock.yaml | pnpm-workspace.yaml | \
              tsconfig.base.json | eslint.config.js | .prettierrc | \
              .prettierignore | .github/workflows/ci.yml)
                js=true ;;
            esac
            case "$f" in
              packages/python/* | fixtures/* | .github/workflows/ci.yml)
                python=true ;;
            esac
          done <<< "$changed"
          echo "js=$js python=$python"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Format check
        run: pnpm exec prettier --check .

      - name: Test
        run: pnpm -r test

      - name: Build @cubehelix-studio/core
        run: pnpm --filter @cubehelix-studio/core build

      - name: Build @cubehelix-studio/web
        run: pnpm --filter @cubehelix-studio/web build

  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "packages/python/uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format check
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest

  # Single always-reported gate. Required in branch protection in place of the
  # path-filtered js/python jobs: a skipped stack is fine, a failed one is not.
  ci:
    needs: [changes, js, python]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify stack results
        run: |
          changes="${{ needs.changes.result }}"
          js="${{ needs.js.result }}"
          python="${{ needs.python.result }}"
          echo "changes=$changes js=$js python=$python"
          if [ "$changes" != "success" ]; then
            echo "Change detection did not succeed."
            exit 1
          fi
          for result in "$js" "$python"; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A CI stack did not pass (result: $result)."
                exit 1 ;;
            esac
          done
          echo "CI gate passed."
